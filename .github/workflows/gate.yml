# The gate. Biome, tsc, Vitest and the production build, on every Node version
# this project supports.
#
# It reaches nothing outside the runner. No secret is read, no host is contacted,
# no deployment happens, and there is no path through this file that could. That
# separation is the point: a commit is a statement about the code, and this
# workflow is what checks the statement. Publishing the application is a
# different gesture, made deliberately, and it lives in deploy.yml.
#
# workflow_call is declared so deploy.yml can run this same gate before shipping,
# rather than keeping a second copy of it that would drift.
#
# tag-and-release.yml waits on this workflow through workflow_run and publishes
# nothing unless it concluded successfully, so a commit that fails here is never
# tagged and never released.

name: Gate

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Newer commits supersede older ones on the same ref. A superseded gate result is
# noise, and cancelling it keeps the run history readable.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything.
permissions:
  contents: read

jobs:
  gate:
    name: Gate on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions this project supports, per engines in package.json, which
        # requires Node 22.13 or newer. A failure that only appears on the newest
        # runtime has happened in sibling projects, which is why the newest is
        # here and not assumed. Node 20 is below the engines floor and the
        # runners drop it on 2026-09-16, so it is not tested.
        node: ['22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The route type globals (PageProps, LayoutProps) are generated by Next
      # into .next/types, which is gitignored, so a fresh checkout does not have
      # them and the type check would fail before the build. Measured on the
      # first run of this workflow, 2026-08-22.
      - name: Generate route types
        run: npx next typegen

      # The same steps as `npm run gate`, run separately so a failure names
      # itself in the job log instead of hiding inside one chained command.
      - name: Lint and format check
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # No configuration here. The build only has to compile: every integration
      # reports itself unconfigured rather than throwing when a variable is
      # absent, so a build with no .env is a real check and not a false pass.
      - name: Build
        run: npm run build
